# Verioax for several users at once: PostgreSQL (one shared database for accounts, activity, feedback and scan history),
# Redis (rate limits shared by every API worker), the API with several workers, and the web app.
#
#   cp .env.example .env
#   # in .env set at least: TRUSTGUARD_API_TOKEN (32+ random characters), POSTGRES_PASSWORD (letters and digits),
#   # VERIOAX_MODERATOR_PIN, VERIOAX_SECRET_KEY; optionally VERIOAX_API_WORKERS (default 4)
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Ports are bound to 127.0.0.1: put a TLS-terminating reverse proxy (nginx, Caddy, a cloud load balancer) in front and
# set VERIOAX_TRUSTED_PROXIES to its address so per-client rate limits see the real client. See docs/deployment.md.
x-verioax-env: &verioax-env
  TRUSTGUARD_DATA_DIR: /app/data/runtime
  TRUSTGUARD_API_TOKEN: ${TRUSTGUARD_API_TOKEN:?set TRUSTGUARD_API_TOKEN in .env (at least 32 random characters)}
  VERIOAX_DATABASE_URL: postgresql://verioax:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/verioax
  VERIOAX_REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verioax
      POSTGRES_USER: verioax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - verioax-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verioax -d verioax"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # rate-limit counters only: nothing worth persisting, bounded memory
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    command: ["sh", "-c", "exec uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers ${VERIOAX_API_WORKERS:-4}"]
    env_file: .env
    environment: *verioax-env
    volumes:
      - verioax-prod-data:/app/data/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ui:
    build: .
    env_file: .env
    environment:
      <<: *verioax-env
      TRUSTGUARD_API_URL: http://api:8000
    volumes:
      - verioax-prod-data:/app/data/runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  verioax-pg:
  verioax-prod-data:

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustguard-ai"
version = "0.1.0"
description = "PII redaction plus explainable scam, hoax and link-integrity analysis for messages, links and documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["phishing", "scam-detection", "pii", "redaction", "url-analysis", "cybersecurity", "india"]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "httpcore>=1.0",
    "certifi",
    "tldextract>=5.1",
    "rapidfuzz>=3.6",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.65", "altair>=5.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
ner = ["spacy>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["trustguard-ai[ui,api,ocr,dev]"]

[tool.setuptools.packages.find]
include = ["trustguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 160
target-version = "py310"
src = [".", "app"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["trustguard", "api"]

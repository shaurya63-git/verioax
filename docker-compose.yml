# TrustGuard AI: REST API + web app as two containers.
#   cp .env.example .env        (add any API keys you have; all optional)
#   docker compose up --build
#   web app: http://localhost:8501     API docs: http://localhost:8000/docs
#
# Both ports are bound to 127.0.0.1 only. If you ever publish the API beyond your own machine, set
# TRUSTGUARD_API_TOKEN in .env first - the web app passes it to the API automatically.
services:
  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      TRUSTGUARD_DATA_DIR: /app/data/runtime
    volumes:
      - trustguard-data:/app/data/runtime
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  ui:
    build: .
    env_file: .env
    environment:
      TRUSTGUARD_API_URL: http://api:8000          # the web app becomes a thin client; history lives with the API
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  trustguard-data:

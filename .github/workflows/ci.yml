name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Theme tokens and Streamlit config in sync
        run: python scripts/sync_theme.py --check
      - name: Tests (no network access)
        run: pytest -q
      - name: Detection evaluation (development set gates the build; held-out set is reported)
        run: python -m trustguard.evaluation --set all --aggregate-only

  shared-services:
    # the PostgreSQL storage layer and the Redis rate limiter, against real servers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verioax
          POSTGRES_PASSWORD: verioax
          POSTGRES_DB: verioax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verioax" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VERIOAX_TEST_POSTGRES_URL: postgresql://verioax:verioax@localhost:5432/verioax_test
      VERIOAX_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Database and rate-limit tests
        run: pytest -q tests/test_db.py tests/test_ratelimit.py
